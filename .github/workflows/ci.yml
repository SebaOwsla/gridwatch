name: GridWatch CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend and simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'backend[dev]' -e simulator pip-audit
      - name: Test Python modules
        run: python -m pytest -q backend/tests simulator/tests
      - name: Audit Python dependencies
        run: python -m pip_audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-gridwatch-password
      JWT_SECRET_KEY: ci-only-gridwatch-jwt-secret-01234567890123456789
      SIMULATOR_INTERVAL_SECONDS: '0.5'
      GRIDWATCH_SMOKE_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare local Compose environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start database, MQTT, API and web
        run: docker compose up -d --build
      - name: Check frontend and API readiness
        run: |
          curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/api/v1/health/ready
      - name: Seed assets and publish simulated measurements
        run: |
          docker compose exec -T api python -m app.cli seed-demo
          docker compose build simulator
          docker compose run --rm --no-deps simulator python -m gridwatch_simulator --cycles 3 --max-wait-seconds 15
      - name: Verify TimescaleDB received twelve samples
        run: |
          for attempt in $(seq 1 20); do
            count=$(docker compose exec -T db psql -U gridwatch -d gridwatch -Atqc 'SELECT count(*) FROM measurements')
            if [ "$count" -ge 12 ]; then
              echo "Persisted $count simulated samples"
              exit 0
            fi
            sleep 1
          done
          echo "Expected at least 12 samples"
          exit 1
      - name: Prepare smoke test tools
        run: python -m pip install -e 'backend[dev]'
      - name: Create temporary CI administrator
        run: |
          password=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$password"
          printf '%s\n' "$password" | docker compose exec -T api python -m app.cli create-admin --email "$GRIDWATCH_SMOKE_EMAIL" --name 'CI Admin' --password-stdin
          echo "GRIDWATCH_SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Verify authenticated end-to-end flow
        run: python backend/tools/integration_smoke.py
      - name: Back up and verify an isolated restore
        run: python backend/tools/backup_db.py --verify
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Clean up CI containers
        if: always()
        run: docker compose down -v --remove-orphans

  pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: gridwatch-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build public simulated demo
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: 'true'
        run: npm run build -- --base /gridwatch/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v5
